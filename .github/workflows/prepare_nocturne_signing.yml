name: Prepare Nocturne Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: xcode-27
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_GIT_URL: https://github.com/xXBlackSoulXx/Match-Secrets.git
    steps:
      - uses: actions/checkout@v5
      - name: Validate source secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in TEAMID GH_PAT MATCH_PASSWORD FASTLANE_KEY_ID FASTLANE_ISSUER_ID FASTLANE_KEY; do
            test -n "${!name}" || { echo "::error::$name unavailable"; exit 1; }
          done
      - name: Install dependencies
        run: bundle install
      - name: Verify app and prepare API key
        run: bundle exec ruby scripts/prepare_nocturne_signing.rb
      - name: Create App Store provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          export MATCH_GIT_BASIC_AUTHORIZATION
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s' "x-access-token:$GH_PAT" | base64 | tr -d '\n')
          bundle exec fastlane match appstore \
            --app_identifier com.blacksoul697.nocturnehealth \
            --git_url "$MATCH_GIT_URL" \
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION" \
            --api_key_path "$NOCTURNE_API_KEY_PATH" \
            --team_id "$TEAMID" \
            --readonly false
      - name: Remove temporary API key
        if: always()
        run: rm -f "${NOCTURNE_API_KEY_PATH:-$RUNNER_TEMP/nocturne-app-store-key.json}"
