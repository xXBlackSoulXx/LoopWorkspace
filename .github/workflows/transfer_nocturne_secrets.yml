name: Transfer Nocturne iOS Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TEAM_ID: ${{ secrets.TEAMID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.FASTLANE_KEY }}
      TARGET_REPO: BlackSoul697/nocturne-ios
      MATCH_REPO: https://github.com/xXBlackSoulXx/Match-Secrets.git
    steps:
      - name: Validate source secrets
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in GH_TOKEN TEAM_ID MATCH_PASSWORD APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is unavailable"
              failed=1
            fi
          done
          exit "$failed"

      - name: Transfer secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TEAM_ID" | gh secret set TEAM_ID --repo "$TARGET_REPO"
          printf '%s' "$MATCH_REPO" | gh secret set MATCH_GIT_URL --repo "$TARGET_REPO"
          printf '%s' "$MATCH_PASSWORD" | gh secret set MATCH_PASSWORD --repo "$TARGET_REPO"
          printf '%s' "x-access-token:$GH_TOKEN" | base64 | tr -d '\n' | gh secret set MATCH_GIT_BASIC_AUTHORIZATION --repo "$TARGET_REPO"
          printf '%s' "$APP_STORE_CONNECT_KEY_ID" | gh secret set APP_STORE_CONNECT_KEY_ID --repo "$TARGET_REPO"
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | gh secret set APP_STORE_CONNECT_ISSUER_ID --repo "$TARGET_REPO"
          printf '%s' "$APP_STORE_CONNECT_KEY" | gh secret set APP_STORE_CONNECT_KEY --repo "$TARGET_REPO"

      - name: Verify destination secret names
        shell: bash
        run: |
          set -euo pipefail
          expected='APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID MATCH_GIT_BASIC_AUTHORIZATION MATCH_GIT_URL MATCH_PASSWORD TEAM_ID'
          actual=$(gh secret list --repo "$TARGET_REPO" --json name --jq 'map(.name) | sort | join(" ")')
          test "$actual" = "$expected"
